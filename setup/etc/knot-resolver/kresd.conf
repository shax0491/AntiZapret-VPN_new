-- Knot DNS Resolver configuration in -*- lua -*-
-- Refer to manual: https://www.knot-resolver.cz/documentation/latest5

local min_ttl = 1800
local max_ttl = 86400
local dns1 = 1
local dns2 = 2
local systemd_instance = os.getenv('SYSTEMD_INSTANCE')
local alternative_zones = policy.todnames({
	'bbs', 'chan', 'cyb', 'dyn', 'epic', 'geek', 'gopher', 'indy', 'libre', 'neo', 'null', 'o', 'oss', 'oz', 'parody', 'pirate', 'opennic.glue',
	'bazar', 'coin', 'emc', 'lib',
	'fur',
	'ku', 'te', 'ti', 'uu', 'ko', 'rm'
})
local nodata_answer = policy.ANSWER({[kres.type.SOA] = {rdata = kres.parse_rdata({'SOA . . 1 1 1 1 ' .. max_ttl}), ttl = max_ttl}}, true)
local zero_a_answer = policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('0.0.0.0'), ttl = max_ttl}})
local zero_aaaa_answer = policy.ANSWER({[kres.type.AAAA] = {rdata = kres.str2ip('::'), ttl = max_ttl}})

local function forward(dns)
	if dns == 1 then
		-- MSK-IX+NSDI+BI.ZONE+TransTeleCom+Cloudflare+Quad9+ControlD+UltraDNS
		return policy.FORWARD({'62.76.76.62', '62.76.62.76', '195.208.4.1', '195.208.5.1', '185.191.32.7', '185.191.32.8', '217.150.34.129', '217.150.35.129'})
	elseif dns == 2 then
		-- SkyDNS+Cloudflare+Quad9+ControlD+UltraDNS
		return policy.FORWARD({'193.58.251.251', '1.1.1.1', '1.0.0.1', '9.9.9.10', '149.112.112.10', '9.9.9.10@9953', '149.112.112.10@9953', '76.76.2.0', '76.76.10.0', '64.6.64.6', '64.6.65.6'})
	elseif dns == 3 then
		return policy.FORWARD({'77.88.8.8', '77.88.8.1', '77.88.8.8@1253', '77.88.8.1@1253'})
	elseif dns == 4 then
		return policy.FORWARD({'8.8.8.8', '8.8.4.4'})
	elseif dns == 5 then
		return policy.FORWARD({'94.140.14.14', '94.140.15.15', '94.140.14.14@5353', '94.140.15.15@5353'})
	elseif dns == 6 then
		return policy.FORWARD({'83.220.169.155', '212.109.195.93', '195.133.25.16'})
	elseif dns == 7 then
		return policy.FORWARD({'111.88.96.50', '111.88.96.51'})
	elseif dns == 8 then
		return policy.FORWARD({'193.233.112.67', '193.233.112.68', '45.155.204.190', '37.230.192.51'})
	else
		panic('Invalid dns value')
	end
end

local function match_query_type(action, target_qtype)
	return function (state, query)
		if query.stype == target_qtype then
			return action
		else
			return nil
		end
	end
end

local function valid_chars_only(state, query)
	local name = kres.dname2str(query.sname)
	if name and not string.match(name, '^[%w%-%._]+%.?$') then
		return policy.DENY
	else
		return nil
	end
end

if string.match(systemd_instance, '^1') then

	net.listen('127.1.1.1', 53, {kind = 'dns', freebind = true})
	user('knot-resolver', 'knot-resolver')
	os.execute('rm -rf /var/cache/knot-resolver/*')
	cache.open(100 * MB, 'lmdb:///var/cache/knot-resolver')

	modules = {
		'view'
		,renumber = dofile('/etc/knot-resolver/renumber.lua')
		,'fallback'
	}

	view:addr('10.29.0.0/22', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.29.0.1'), ttl = min_ttl}}), {todname(hostname())}))
	view:addr('10.29.4.0/22', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.29.4.1'), ttl = min_ttl}}), {todname(hostname())}))
	view:addr('10.29.8.0/24', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.29.8.1'), ttl = min_ttl}}), {todname(hostname())}))
	view:addr('10.29.9.0/24', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.29.9.1'), ttl = min_ttl}}), {todname(hostname())}))

	for _, item in ipairs(policy.special_names) do
		policy.add(item.cb)
	end

	policy.add(valid_chars_only)
	policy.add(policy.pattern(policy.DENY, '.*_.*\4arpa\0'))
	policy.add(policy.pattern(policy.DENY, '^\3_gc'))
	policy.add(policy.pattern(policy.DENY, '^\5_ldap'))
	policy.add(policy.pattern(policy.DENY, '^\6_vlmcs'))
	policy.add(policy.pattern(policy.DENY, '^\8_kpasswd'))
	policy.add(policy.pattern(policy.DENY, '^\9_kerberos'))
	policy.add(policy.pattern(policy.DENY, '\6_msdcs'))
	policy.add(policy.pattern(policy.DENY, '\6_sites'))
	policy.add(policy.pattern(policy.DENY, '^\4wpad'))
	policy.add(policy.pattern(policy.DENY, '^[\10\11]_aaplcache'))
	policy.add(policy.pattern(policy.DENY, '\7_dns%-sd'))
	policy.add(match_query_type(zero_aaaa_answer, kres.type.AAAA))
	policy.add(match_query_type(nodata_answer, kres.type.HTTPS))
	policy.add(match_query_type(nodata_answer, kres.type.SVCB))
	policy.add(policy.all(policy.FLAGS({'NO_EDNS', 'NO_0X20'})))

	dofile('/etc/knot-resolver/custom.lua')

	policy.add(policy.rpz(zero_a_answer, '/etc/knot-resolver/deny.rpz', true))
	policy.add(policy.rpz(policy.STUB('127.4.4.4'), '/etc/knot-resolver/warp.rpz', true))
	policy.add(policy.rpz(policy.STUB('127.3.3.3'), '/etc/knot-resolver/proxy.rpz', true))

	policy.add(
		policy.suffix(
			policy.FORWARD({'94.247.43.254', '95.216.99.249', '152.53.15.127', '185.226.181.19'}),
			alternative_zones
		)
	)

	policy.add(policy.all(forward(dns1)))

elseif string.match(systemd_instance, '^2') then

	net.listen('127.2.2.2', 53, {kind = 'dns', freebind = true})
	user('knot-resolver', 'knot-resolver')
	os.execute('rm -rf /var/cache/knot-resolver2/*')
	cache.open(100 * MB, 'lmdb:///var/cache/knot-resolver2')

	modules = {
		'view'
		,renumber = dofile('/etc/knot-resolver/renumber2.lua')
		,'fallback'
	}

	view:addr('10.28.0.0/22', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.28.0.1'), ttl = min_ttl}}), {todname(hostname())}))
	view:addr('10.28.4.0/22', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.28.4.1'), ttl = min_ttl}}), {todname(hostname())}))
	view:addr('10.28.8.0/24', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.28.8.1'), ttl = min_ttl}}), {todname(hostname())}))
	view:addr('10.28.9.0/24', policy.domains(policy.ANSWER({[kres.type.A] = {rdata = kres.str2ip('10.28.9.1'), ttl = min_ttl}}), {todname(hostname())}))

	for _, item in ipairs(policy.special_names) do
		policy.add(item.cb)
	end

	policy.add(valid_chars_only)
	policy.add(policy.pattern(policy.DENY, '.*_.*\4arpa\0'))
	policy.add(policy.pattern(policy.DENY, '^\3_gc'))
	policy.add(policy.pattern(policy.DENY, '^\5_ldap'))
	policy.add(policy.pattern(policy.DENY, '^\6_vlmcs'))
	policy.add(policy.pattern(policy.DENY, '^\8_kpasswd'))
	policy.add(policy.pattern(policy.DENY, '^\9_kerberos'))
	policy.add(policy.pattern(policy.DENY, '\6_msdcs'))
	policy.add(policy.pattern(policy.DENY, '\6_sites'))
	policy.add(policy.pattern(policy.DENY, '^\4wpad'))
	policy.add(policy.pattern(policy.DENY, '^[\10\11]_aaplcache'))
	policy.add(policy.pattern(policy.DENY, '\7_dns%-sd'))
	policy.add(match_query_type(zero_aaaa_answer, kres.type.AAAA))
	policy.add(match_query_type(nodata_answer, kres.type.HTTPS))
	policy.add(match_query_type(nodata_answer, kres.type.SVCB))
	policy.add(policy.all(policy.FLAGS({'NO_EDNS', 'NO_0X20'})))

	dofile('/etc/knot-resolver/custom2.lua')

	policy.add(policy.rpz(zero_a_answer, '/etc/knot-resolver/deny2.rpz', true))

	policy.add(
		policy.suffix(
			policy.FORWARD({'94.247.43.254', '95.216.99.249', '152.53.15.127', '185.226.181.19'}),
			alternative_zones
		)
	)

	policy.add(policy.all(forward(dns2)))

else panic('Use kresd@1 or kresd@2 instance names')

end

trust_anchors.remove('.')
net.ipv6 = false
net.tcp_pipeline(1000)
cache.min_ttl(min_ttl)
cache.max_ttl(max_ttl)
cache.ns_tout(1000)

modules.unload('refuse_nord')
modules.unload('validate')
modules.unload('ta_update')
modules.unload('ta_signal_query')
modules.unload('ta_sentinel')
modules.unload('detect_time_skew')
modules.unload('extended_error')
modules.unload('priming')
modules.unload('edns_keepalive')
modules.unload('detect_time_jump')
